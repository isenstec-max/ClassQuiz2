version: "3"

services:
  frontend:
    restart: always
    image: smarttechlab/classquiz2:latest
    pull_policy: always
    depends_on:
      - redis
      - api
    environment:
      REDIS_URL: redis://redis:6379/0?decode_responses=True
      API_URL: http://api:80

  api:
    image: ghcr.io/mawoka-myblock/classquiz-backend:master
    restart: &restart always
    depends_on: &depends
      - db
      - redis
    environment: &env_vars
      DB_URL: "postgresql://postgres:classquiz@db:5432/classquiz"
      REDIS: "redis://redis:6379/0?decode_responses=True"
      SECRET_KEY: "CHANGE_THIS_SECRET_KEY_FOR_PROD"
      MAX_WORKERS: "1"
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      MEILISEARCH_URL: "http://meilisearch:7700"
      ROOT_ADDRESS: "https://industry4.fvt.tuke.sk:8000"
      STORAGE_BACKEND: "local"
      STORAGE_PATH: "/app/data"
      SKIP_EMAIL_VERIFICATION: "True"
    volumes:
      - ./uploads:/app/data
      - ./classquiz:/app/classquiz

  redis:
    image: valkey/valkey:alpine
    restart: always
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]

  db:
    image: postgres:14-alpine
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_PASSWORD: "classquiz"
      POSTGRES_DB: "classquiz"
    volumes:
      - data:/var/lib/postgresql/data

  proxy:
    image: ghcr.io/mawoka-myblock/classquiz-caddy:master
    restart: always
    ports:
      - "8000:8080"
    volumes:
      - ./Caddyfile-production:/etc/caddy/Caddyfile:ro
      - ${HOME}/certs:/certs:ro

  meilisearch:
    image: getmeili/meilisearch:v0.28.0
    restart: always
    environment:
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meilisearch-data:/data.ms

  worker:
    image: ghcr.io/mawoka-myblock/classquiz-backend:master
    environment: *env_vars
    depends_on: *depends
    restart: *restart
    volumes:
      - ./classquiz:/app/classquiz
    command: arq classquiz.worker.WorkerSettings

volumes:
  data:
  meilisearch-data:
